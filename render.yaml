services:
  - type: web
    name: inventory-mgmt-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://inventory-mgmt-system.vercel.app,https://inventory-mgmt-system-frontend.vercel.app"
